name: CodeQL

on:
  pull_request:
    paths:
      - .github/workflows/codeql.yml
  push:
    branches: [dev, main, release/*]
  schedule:
    - cron: 30 1 * * 1 # At 01:30 UTC every Monday

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/microsoft/kompli/ubuntu-22.04-amd64@sha256:006b8545d00520c1cfc83f0ac465d7aedeb876a32435c57bbe3dc94c23fdc465
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        # CodeQL language support https://aka.ms/codeql-docs/language-support
        language: [cpp]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          clean: true

      - name: Mark workspace as safe for git in container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd
        with:
          languages: ${{ matrix.language }}

      - name: Generate build
        run: cmake -S src -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF -DBUILD_TELEMETRY=OFF

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd
        with:
          category: '/language:${{matrix.language}}'

  # Needed for required checks to aggregate the results of all codeql executions
  codeql-status:
    runs-on: ubuntu-latest
    needs: [analyze]
    if: always()
    steps:
      - run: ${{!contains(needs.*.result, 'failure')}}
