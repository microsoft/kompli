name: Dependency review

# Scans pull requests for dependencies (including submodules and Docker base
# images) that introduce known vulnerabilities or incompatible licenses, and
# blocks the PR before the change is merged.
on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Allows the action to post a summary comment on the pull request.
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency review
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          # Fail the check when a moderate-or-higher severity vulnerability is
          # introduced by the pull request.
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
