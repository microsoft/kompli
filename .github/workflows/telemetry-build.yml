name: Telemetry build

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  BUILD_TYPE: Release
  MOUNT: /kompli
  REGISTRY: ghcr.io
  # WARNING: This is an intentionally invalid placeholder and must not be used for telemetry ingestion.
  KompliTelemetryApiKey: 999999999999999999999999999999999-999999999-9999-9999-9999-999999999999-9999

jobs:
  build:
    name: Build with telemetry enabled
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          clean: true

      - name: Warn about invalid telemetry key
        run: echo "::warning::KompliTelemetryApiKey is an intentionally invalid placeholder; this workflow only verifies that telemetry builds."

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Run container
        id: container
        uses: ./.github/actions/container-run
        with:
          registry: ${{ env.REGISTRY }}
          container: microsoft/kompli/ubuntu-22.04-amd64
          mount: ${{ github.workspace }}:${{ env.MOUNT }}
          tag: "@sha256:93793e1d5981e4abf256988afabe289807ef6f710714b394b51e5baf6d9a77e5"
          verify: true
          args: -e KompliTelemetryApiKey=${{ env.KompliTelemetryApiKey }}

      - name: Generate build
        uses: ./.github/actions/container-exec
        with:
          container: ${{ steps.container.outputs.id }}
          cmd: cmake -S src -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DBUILD_TESTS=OFF -DBUILD_TELEMETRY=ON

      - name: Build kompli
        uses: ./.github/actions/container-exec
        with:
          container: ${{ steps.container.outputs.id }}
          cmd: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel
