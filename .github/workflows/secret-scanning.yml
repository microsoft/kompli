name: Secret scanning

# Scans the repository and pull requests for committed secrets (API keys,
# tokens, credentials) using TruffleHog. This complements GitHub's native
# secret scanning by running on every push and pull request and verifying
# detected secrets where possible.
on:
  push:
    branches: [dev, main]
  pull_request:
  schedule:
    - cron: "30 7 * * 1" # 07:30 UTC every Monday
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trufflehog:
    name: TruffleHog
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the scan covers the whole diff range, not just the
          # tip commit.
          fetch-depth: 0

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@20652fbbdefffcdaa493a5bf57ab2ac6b1db715b # v3.97.1
        with:
          extra_args: --results=verified,unknown
