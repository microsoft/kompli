name: Static analysis

on: [push, pull_request]

permissions:
  contents: read
  packages: read

jobs:
  analyze-static:
    name: Analyze Static Code
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/microsoft/kompli/ubuntu-22.04-amd64@sha256:ff9492087fda67081afee9fff170d3ab0636eec5cac54afc5c315382ce33d253

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          clean: true

      - name: Prepare compile command database
        run: |
          mkdir -p build
          cd build
          cmake -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_BUILD_TYPE=Debug ../src

      - name: "Temporary: install clang-tools"
        run: |
          apt-get update
          apt-get install -y clang-tools

      - name: Run clang static analyzer
        run: |
          mkdir -p output
          analyze-build-14 --verbose \
            --status-bugs \
            --exclude src/common/parson \
            --cdb build/compile_commands.json \
            --output output/scan-build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: success() || failure()
        with:
          name: scan-build
          path: |
            output/scan-build
