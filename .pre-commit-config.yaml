# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
    - id: end-of-file-fixer
      exclude: |
         (?x)^(
            .*/fuzzer/seed_corpus/.*|
            .*/fuzzer/parsers/corpus/login-defs/15-no-final-newline|
            devops/docker/.*/Dockerfile
            )$
    - id: trailing-whitespace
      exclude: |
         (?x)^(
            .*/fuzzer/seed_corpus/.*
            )$
    - id: mixed-line-ending
      args: ['--fix', 'lf']
      files: |
         (?x)(
          .*\.c|
          .*\.h|
          .*\.cpp|
          .*\.hpp|
          .*\.cs|
          .*\.md|
          .*\.cmake|
          .*\.toml|
          .*\.json|
          .*\.txt
            )$
    - id: mixed-line-ending
      args: ['--fix', 'crlf']
      files: |
         (?x)(
         .*\.cmd|
         .*\.csrpoj
         )$
  - repo: local
    hooks:
      - id: clang-tidy
        name: Run clang-tidy
        types_or: [c++]
        entry: src/tests/clang-tidy/run-clang-tidy.py
        language: python
        additional_dependencies: [clang-tidy]
        files: |
          (?x)(
          ^src/(engine|benchmarkio|kompli|tools/lua-evaluator|modules/complianceengine/src)/.*\.h$|
          ^src/(engine|benchmarkio|kompli|tools/lua-evaluator|modules/complianceengine/src)/.*\.hpp$|
          ^src/(engine|benchmarkio|kompli|tools/lua-evaluator|modules/complianceengine/src)/.*\.cpp$|
          ^src/telemetry/.*\.h$|
          ^src/telemetry/.*\.hpp$|
          ^src/telemetry/.*\.c$
            )
        exclude: ^src/engine/tests/
  - repo: local
    hooks:
      - id: compliance-engine-interface
        name: Generate symbolic compliance engine interface
        types_or: [c++, json]
        entry: src/engine/GenInterface.py
        language: python
        require_serial: true
        files: |
          (?x)(
          ^src/engine/payload.schema.json$|
          ^src/engine/procedures/.*\.h$|
          ^src/engine/procedures/.*\.schema.json$
            )
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v14.0.6
    hooks:
    - id: clang-format
      files: |
         (?x)(
          ^src/(engine|benchmarkio|kompli|tools/lua-evaluator|modules/complianceengine)/.*\.h$|
          ^src/(engine|benchmarkio|kompli|tools/lua-evaluator|modules/complianceengine)/.*\.hpp$|
          ^src/(engine|benchmarkio|kompli|tools/lua-evaluator|modules/complianceengine)/.*\.cpp$|
          ^src/telemetry/.*\.h$|
          ^src/telemetry/.*\.hpp$|
          ^src/telemetry/.*\.c$
            )
      exclude: |
        (?x)(
        ^src/engine/ProcedureMap.h$|
        ^src/engine/ProcedureMap.cpp$
        )
